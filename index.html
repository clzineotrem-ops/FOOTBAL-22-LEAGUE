<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOOTBAL 22 LEAGUE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071526;color:white;font-family:Arial;overflow:hidden}
#top{position:absolute;top:10px;left:0;width:100%;text-align:center;z-index:5;pointer-events:none}
#title{font-size:19px;font-weight:bold;text-shadow:0 2px 5px black}
#score{font-size:25px;font-weight:bold;margin-top:5px}
#message{font-size:13px;margin-top:4px}
#controls{position:absolute;bottom:18px;left:0;width:100%;display:flex;justify-content:space-between;align-items:end;padding:0 15px;z-index:8;pointer-events:none}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}
.btn{border:1px solid #ffffff88;background:#102b4ddd;color:white;border-radius:12px;font-size:20px;font-weight:bold;touch-action:none}
.pad .up{grid-column:2;grid-row:1}
.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}
.pad .right{grid-column:3;grid-row:2}
.actions{display:flex;flex-direction:column;gap:9px;pointer-events:auto}
.actions button{width:76px;height:55px;font-size:13px}
#restart{position:absolute;top:12px;right:12px;z-index:9;background:#102b4d;color:white;border:1px solid white;border-radius:8px;padding:9px}
</style>
</head>
<body>
<div id="top">
 <div id="title">FOOTBAL 22 LEAGUE</div>
 <div id="score">AZUL 0 × 0 VERMELHO</div>
 <div id="message">Prepare-se para jogar!</div>
</div>
<button id="restart">REINICIAR</button>
<div id="controls">
 <div class="pad">
  <button class="btn up" data-key="up">▲</button>
  <button class="btn left" data-key="left">◀</button>
  <button class="btn down" data-key="down">▼</button>
  <button class="btn right" data-key="right">▶</button>
 </div>
 <div class="actions">
  <button class="btn" id="sprint">CORRER</button>
  <button class="btn" id="pass">PASSE</button>
  <button class="btn" id="shoot">CHUTAR</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83b9df);
scene.fog=new THREE.Fog(0x83b9df,55,100);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);
camera.position.set(0,29,35);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x42633c,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-10,25,12);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const green=new THREE.Mesh(
 new THREE.PlaneGeometry(44,28),
 new THREE.MeshStandardMaterial({color:0x287d35,roughness:.9})
);
green.rotation.x=-Math.PI/2;
green.receiveShadow=true;
scene.add(green);

const stripes=[];
for(let i=0;i<8;i++){
 const s=new THREE.Mesh(
  new THREE.PlaneGeometry(5.5,28),
  new THREE.MeshStandardMaterial({color:i%2?0x287d35:0x328d3c})
 );
 s.rotation.x=-Math.PI/2;
 s.position.set(-19.25+i*5.5,.012,0);
 scene.add(s);
}

function line(x1,z1,x2,z2,color=0xffffff){
 const points=[new THREE.Vector3(x1,.04,z1),new THREE.Vector3(x2,.04,z2)];
 const obj=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(points),
  new THREE.LineBasicMaterial({color})
 );
 scene.add(obj);
}
line(-21,-13,21,-13);
line(-21,13,21,13);
line(-21,-13,-21,13);
line(21,-13,21,13);
line(0,-13,0,13);
const circle=new THREE.Mesh(
 new THREE.RingGeometry(4.8,4.95,64),
 new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
);
circle.rotation.x=-Math.PI/2;
circle.position.y=.05;
scene.add(circle);
line(-21,-7,-15,-7);
line(-15,-7,-15,7);
line(-15,7,-21,7);
line(21,-7,15,-7);
line(15,-7,15,7);
line(15,7,21,7);

function goal(x){
 const mat=new THREE.MeshStandardMaterial({color:0xffffff});
 const group=new THREE.Group();
 function bar(px,py,pz,sx,sy,sz){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(px,py,pz);
  group.add(m);
 }
 bar(x,1.3,-3.5,.18,2.6,.18);
 bar(x,1.3,3.5,.18,2.6,.18);
 bar(x,2.6,0,.18,.18,7);
 scene.add(group);
}
goal(-21);
goal(21);

function makePlayer(color,x,z){
 const group=new THREE.Group();
 const shirt=new THREE.Mesh(
  new THREE.CylinderGeometry(.48,.57,1.15,16),
  new THREE.MeshStandardMaterial({color,roughness:.7})
 );
 shirt.position.y=1.15;
 shirt.castShadow=true;
 group.add(shirt);
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.3,16,12),
  new THREE.MeshStandardMaterial({color:0xd9a47c})
 );
 head.position.y=1.95;
 head.castShadow=true;
 group.add(head);
 const shorts=new THREE.Mesh(
  new THREE.CylinderGeometry(.43,.45,.4,12),
  new THREE.MeshStandardMaterial({color:0x172033})
 );
 shorts.position.y=.45;
 group.add(shorts);
 const legmat=new THREE.MeshStandardMaterial({color:0x20242a});
 for(let side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.55,10),legmat);
  leg.position.set(side*.2,.15,0);
  group.add(leg);
 }
 group.position.set(x,0,z);
 scene.add(group);
 return group;
}

const blue=[
 makePlayer(0x0878ff,-5,0),
 makePlayer(0x0878ff,-10,-7),
 makePlayer(0x0878ff,-10,7),
 makePlayer(0x0878ff,-16,-3),
 makePlayer(0x0878ff,-18,0)
];
const red=[
 makePlayer(0xe52323,5,0),
 makePlayer(0xe52323,10,-7),
 makePlayer(0xe52323,10,7),
 makePlayer(0xe52323,16,-3),
 makePlayer(0xe52323,18,0)
];
let selected=0;
let ball;
function makeBall(){
 if(ball)scene.remove(ball);
 ball=new THREE.Mesh(
  new THREE.SphereGeometry(.38,24,16),
  new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55})
 );
 ball.position.set(0,.4,0);
 ball.castShadow=true;
 scene.add(ball);
}
makeBall();

let velocity=new THREE.Vector3();
let blueScore=0,redScore=0;
let keys={};
let sprint=false;
let last=0;

function updateScore(){
 document.getElementById("score").textContent=
 "AZUL "+blueScore+" × "+redScore+" VERMELHO";
}
function message(t){
 document.getElementById("message").textContent=t;
}
function resetBall(){
 ball.position.set(0,.4,0);
 velocity.set(0,0,0);
 blue[0].position.set(-5,0,0);
 red[0].position.set(5,0,0);
}
function movePlayer(dt){
 const p=blue[selected];
 const dir=new THREE.Vector3(
  (keys.right?1:0)-(keys.left?1:0),
  0,
  (keys.down?1:0)-(keys.up?1:0)
 );
 if(dir.length()>0){
  dir.normalize();
  const speed=sprint?10:6;
  p.position.addScaledVector(dir,speed*dt);
  p.position.x=THREE.MathUtils.clamp(p.position.x,-20,20);
  p.position.z=THREE.MathUtils.clamp(p.position.z,-12,12);
  p.rotation.y=Math.atan2(dir.x,dir.z);
 }
}
function kick(power){
 const p=blue[selected];
 const distance=p.position.distanceTo(ball.position);
 if(distance<2.2){
  const direction=new THREE.Vector3(1,0,0);
  direction.z=(ball.position.z-p.position.z)*.12;
  direction.normalize();
  velocity.copy(direction.multiplyScalar(power));
  velocity.y=power*.12;
  message(power>12?"CHUTE!":"PASSE!");
 }else{
  message("Chegue mais perto da bola!");
 }
}
function ai(dt){
 for(let i=0;i<red.length;i++){
  const p=red[i];
  const target=i===4?
   new THREE.Vector3(18,0,ball.position.z*.3):
   new THREE.Vector3(ball.position.x+1,0,ball.position.z);
  const d=target.clone().sub(p.position);
  if(d.length()>.5){
   d.normalize();
   p.position.addScaledVector(d,(i===4?2.5:3.5)*dt);
   p.position.x=THREE.MathUtils.clamp(p.position.x,-20,20);
   p.position.z=THREE.MathUtils.clamp(p.position.z,-12,12);
  }
  if(p.position.distanceTo(ball.position)<1.2&&Math.random()<.025){
   velocity.set(-8,1,(Math.random()-.5)*5);
  }
 }
}
function ballPhysics(dt){
 velocity.y-=12*dt;
 ball.position.addScaledVector(velocity,dt);
 if(ball.position.y<.38){
  ball.position.y=.38;
  velocity.y=Math.abs(velocity.y)*.45;
  if(Math.abs(velocity.y)<.6)velocity.y=0;
 }
 velocity.x*=Math.pow(.985,dt*60);
 velocity.z*=Math.pow(.985,dt*60);
 if(Math.abs(velocity.x)<.04)velocity.x=0;
 if(Math.abs(velocity.z)<.04)velocity.z=0;
 if(Math.abs(ball.position.z)>13){
  ball.position.z=Math.sign(ball.position.z)*13;
  velocity.z*=-.5;
 }
 for(const p of [...blue,...red]){
  const dx=ball.position.x-p.position.x;
  const dz=ball.position.z-p.position.z;
  const d=Math.hypot(dx,dz);
  if(d<1.05&&ball.position.y<1.5){
   const a=Math.atan2(dz,dx);
   velocity.x+=Math.cos(a)*1.2;
   velocity.z+=Math.sin(a)*1.2;
  }
 }
 if(ball.position.x>21){
  if(Math.abs(ball.position.z)<3.5){
   blueScore++;
   updateScore();
   message("GOOOOOOL DO AZUL!");
  }else message("Bola saiu!");
  resetBall();
 }
 if(ball.position.x<-21){
  if(Math.abs(ball.position.z)<3.5){
   redScore++;
   updateScore();
   message("GOL DO VERMELHO!");
  }else message("Bola saiu!");
  resetBall();
 }
}
function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/1000,.04);
 last=t;
 movePlayer(dt);
 ai(dt);
 ballPhysics(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  b.addEventListener(ev,()=>keys[k]=false)
 );
});
document.getElementById("sprint").addEventListener("pointerdown",()=>{
 sprint=true;
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>
 document.getElementById("sprint").addEventListener(ev,()=>sprint=false)
);
document.getElementById("shoot").onclick=()=>kick(17);
document.getElementById("pass").onclick=()=>kick(9);
document.getElementById("restart").onclick=()=>{
 blueScore=0;redScore=0;updateScore();resetBall();message("Partida reiniciada!");
};
window.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b12">
<title>FOOTBAL 22 LEAGUE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b12;color:white;font-family:Arial;text-align:center}
header{padding:18px;background:#102d1c}
h1{color:#ffd700;margin:5px;font-size:27px}
#score{font-size:25px;margin:12px}
#field{width:94%;max-width:440px;height:510px;margin:auto;background:#168b42;border:5px solid white;border-radius:8px;position:relative;overflow:hidden}
.line{position:absolute;border:2px solid white;left:20%;width:60%;height:100px;top:0}
.center{position:absolute;top:50%;left:0;width:100%;border-top:2px solid white}
#goal{position:absolute;top:0;left:34%;width:32%;height:35px;border:4px solid white;border-top:0}
.player{position:absolute;width:34px;height:34px;border-radius:50%;background:#1675ff;border:3px solid white;bottom:75px;left:calc(50% - 17px);z-index:3}
#keeper{position:absolute;top:40px;left:calc(50% - 18px);width:36px;height:36px;background:#ed2929;border:3px solid white;border-radius:50%;z-index:3}
#ball{position:absolute;width:17px;height:17px;background:white;border:2px solid black;border-radius:50%;bottom:115px;left:calc(50% - 8px);z-index:4}
.controls{display:flex;justify-content:center;gap:12px;align-items:center;margin:18px auto}
.pad{display:grid;grid-template-columns:48px 48px 48px;gap:5px}
button{border:0;border-radius:10px;padding:15px;background:#f3c900;color:#111;font-weight:bold;font-size:17px;touch-action:none}
.pad button{padding:12px 5px;background:#ddd}
#shoot{background:#ff5722;color:white;padding:23px}
#message{font-size:18px;min-height:28px}
#restart{background:#1675ff;color:white;margin-bottom:20px}
</style>
</head>
<body>
<header>
<h1>⚽ FOOTBAL 22 LEAGUE</h1>
<div>O FUTURO DO FUTEBOL!</div>
</header>
<div id="score">BRASIL 0 × 0 ADVERSÁRIO</div>
<div id="field">
<div id="goal"></div>
<div class="line"></div>
<div class="center"></div>
<div id="keeper"></div>
<div class="player" id="player"></div>
<div id="ball"></div>
</div>
<div id="message">Mova o jogador e faça o gol!</div>
<div class="controls">
<div class="pad">
<span></span><button data-move="up">▲</button><span></span>
<button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button>
</div>
<button id="shoot">CHUTAR ⚽</button>
</div>
<button id="restart">NOVO JOGO</button>
<script>
const field=document.getElementById("field");
const player=document.getElementById("player");
const ball=document.getElementById("ball");
const keeper=document.getElementById("keeper");
const message=document.getElementById("message");
const score=document.getElementById("score");
let x=field.clientWidth/2-17;
let y=field.clientHeight-110;
let kx=field.clientWidth/2-18;
let goals=0, shots=0, busy=false;
function draw(){
 player.style.left=x+"px";
 player.style.top=y+"px";
 ball.style.left=(x+9)+"px";
 ball.style.top=(y-12)+"px";
}
function move(dir){
 if(busy)return;
 if(dir==="up")y-=13;
 if(dir==="down")y+=13;
 if(dir==="left")x-=13;
 if(dir==="right")x+=13;
 x=Math.max(5,Math.min(field.clientWidth-39,x));
 y=Math.max(65,Math.min(field.clientHeight-45,y));
 draw();
}
document.querySelectorAll("[data-move]").forEach(btn=>{
 let timer;
 btn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 move(btn.dataset.move);
 timer=setInterval(()=>move(btn.dataset.move),90);
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
 btn.addEventListener(ev,()=>clearInterval(timer)));
});
function updateScore(){
 score.textContent="BRASIL "+goals+" × "+(shots-goals)+" ADVERSÁRIO";
}
function shoot(){
 if(busy)return;
 busy=true;
 shots++;
 let target=Math.random()*field.clientWidth*0.6+field.clientWidth*0.2;
 let save=Math.abs(target-(kx+18))<45;
 let ballStartX=x+9;
 let startY=y-12;
 let endX=target;
 let step=0;
 message.textContent="CHUTANDO...";
 let animation=setInterval(()=>{
 step++;
 let progress=step/18;
 ball.style.left=(ballStartX+(endX-ballStartX)*progress)+"px";
 ball.style.top=(startY- (startY+20)*progress)+"px";
 if(step===18){
 clearInterval(animation);
 if(!save){
 goals++;
 message.textContent="⚽ GOOOOOL DO BRASIL!";
 }else{
 message.textContent="🧤 O GOLEIRO DEFENDEU!";
 }
 updateScore();
 setTimeout(resetPosition,1300);
 }
 },35);
 kx=Math.max(0,Math.min(field.clientWidth-36,target-18));
 keeper.style.left=kx+"px";
}
function resetPosition(){
 x=field.clientWidth/2-17;
 y=field.clientHeight-110;
 keeper.style.left=(field.clientWidth/2-18)+"px";
 ball.style.left=(x+9)+"px";
 ball.style.top=(y-12)+"px";
 draw();
 busy=false;
 if(shots>=5){
 message.textContent="FIM DO JOGO! Brasil: "+goals+" gols em 5 chutes!";
 }
}
document.getElementById("shoot").addEventListener("click",shoot);
document.getElementById("restart").addEventListener("click",()=>{
 goals=0;shots=0;busy=false;
 updateScore();
 message.textContent="NOVO JOGO! Faça o seu gol!";
 resetPosition();
});
draw();
window.addEventListener("resize",()=>{
 x=field.clientWidth/2-17;
 y=field.clientHeight-110;
 draw();
});
</script>
</body>
</html>
